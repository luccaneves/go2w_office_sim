# Frontier Explorer Parameters for GO2W
# BFS frontier-based autonomous explorer with GVD clearance tiebreaking.
# Adapted from auto_explore_sim for GO2W robot (base frame: "base").

frontier_explorer:
  ros__parameters:
    planner_frequency: 0.2

    # GO2W uses "base" frame (not "base_link")
    robot_base_frame: base
    global_frame: map

    transform_tolerance: 2.0
    min_frontier_size: 20
    clearance_scale: 0.2
    progress_timeout: 30.0
    blacklist_timeout: 120.0
    blacklist_radius: 0.5
    return_to_init: false
    visualize: true
    gvd_min_clearance: 5
    gvd_snap_radius: 1.0
    visualize_gvd: true
    gvd_marker_publish_every: 3
    gvd_marker_stride: 2
    profile_timing: true
    profile_log_interval: 10.0
    profile_callbacks: true
    profile_callback_log_interval: 10.0
